baseURL = 'https://giligili612.github.io/blog/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = 'ElegantBlog'
enableRobotsTXT = true
summaryLength = 40
disableKinds = ['taxonomy', 'term']

[pagination]
  pagerSize = 20

[params]
  author = '黄泽坤'
  description = '自由的个人技术博客。'
  footer = '计算机、数学、物理还有自己学习的杂七杂八的东西，说不定还会更新小说呢'

[menus]
  [[menus.main]]
    name = '首页'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = '专题'
    pageRef = '/topics/'
    weight = 20
  [[menus.main]]
    name = '归档'
    pageRef = '/archives/'
    weight = 30
  [[menus.main]]
    name = '关于'
    pageRef = '/about/'
    weight = 40

[markup]
  [markup.highlight]
    style = 'friendly'
    lineNos = false
    noClasses = false
    codeFences = true
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML']
  taxonomy = ['HTML']
  term = ['HTML']

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5
