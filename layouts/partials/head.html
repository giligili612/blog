<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>
  {{- if .IsHome -}}
    {{ .Site.Title }}
  {{- else if eq .Title "404 Page not found" -}}
    页面未找到 · {{ .Site.Title }}
  {{- else -}}
    {{ .Title }} · {{ .Site.Title }}
  {{- end -}}
</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | plainify | truncate 160 }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
<meta name="author" content="{{ .Site.Params.author }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ with .OutputFormats.Get "RSS" }}
<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}">
{{ end }}
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" crossorigin="anonymous">
{{ if or .Params.math .Site.Params.math }}
<link rel="stylesheet" href="{{ "vendor/katex/katex.min.css" | relURL }}">
{{ end }}
